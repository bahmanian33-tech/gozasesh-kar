<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ورود و خروج">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.svg">
    <link rel="icon" type="image/svg+xml" href="icon-192.svg">
    <link rel="stylesheet" href="styles.css">
    <title>سیستم ثبت ورود و خروج</title>
    <style>
      #installOverlay {
        display: none; position: fixed; inset: 0; z-index: 99999;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff; flex-direction: column; align-items: center; justify-content: center;
        padding: 28px 20px; text-align: center; font-family: Tahoma, sans-serif;
      }
      #installOverlay.show { display: flex; }
      #installOverlay h2 { font-size: 22px; margin-bottom: 12px; }
      #installOverlay p { font-size: 15px; line-height: 1.8; opacity: 0.95; max-width: 340px; margin-bottom: 16px; }
      #installOverlay .install-btn {
        background: #fff; color: #667eea; border: none; border-radius: 12px;
        padding: 14px 28px; font-size: 16px; font-weight: 700; cursor: pointer; min-width: 200px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.2); margin: 6px;
      }
      #installOverlay .skip-btn {
        background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.5);
        border-radius: 12px; padding: 12px 24px; font-size: 14px; cursor: pointer; min-width: 200px; margin: 6px;
      }
      #installOverlay .hint { margin-top: 14px; font-size: 13px; opacity: 0.9; max-width: 320px; line-height: 1.7; }
      #timePickerModal {
        display: none; position: fixed; inset: 0; z-index: 100000;
        background: rgba(0,0,0,0.45); align-items: flex-end; justify-content: center;
      }
      #timePickerModal.show { display: flex; }
      .tp-sheet {
        width: 100%; max-width: 420px; background: #f2f2f7;
        border-radius: 16px 16px 0 0; padding: 0 0 20px;
        box-shadow: 0 -8px 32px rgba(0,0,0,0.2);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      }
      .tp-header {
        display: flex; justify-content: space-between; align-items: center;
        padding: 12px 16px; border-bottom: 1px solid #e5e5ea;
      }
      .tp-header button {
        background: none; border: none; color: #007aff; font-size: 17px;
        font-weight: 600; cursor: pointer; min-width: auto; padding: 8px 4px;
      }
      .tp-header .tp-title { font-size: 15px; font-weight: 600; color: #1c1c1e; }
      .tp-date { text-align: center; padding: 10px; font-size: 14px; color: #8e8e93; }
      .tp-wheels {
        display: flex; justify-content: center; align-items: center;
        height: 220px; position: relative; direction: ltr;
        margin: 0 24px; overflow: hidden;
      }
      .tp-wheels::before, .tp-wheels::after {
        content: ''; position: absolute; left: 0; right: 0; height: 80px; z-index: 2; pointer-events: none;
      }
      .tp-wheels::before {
        top: 0; background: linear-gradient(to bottom, rgba(242,242,247,0.95), rgba(242,242,247,0));
      }
      .tp-wheels::after {
        bottom: 0; background: linear-gradient(to top, rgba(242,242,247,0.95), rgba(242,242,247,0));
      }
      .tp-highlight {
        position: absolute; left: 8px; right: 8px; top: 50%; transform: translateY(-50%);
        height: 40px; border-top: 1px solid #c7c7cc; border-bottom: 1px solid #c7c7cc;
        border-radius: 8px; background: rgba(0,0,0,0.04); z-index: 1; pointer-events: none;
      }
      .tp-col {
        height: 220px; overflow-y: auto; scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch; width: 72px; z-index: 3; scrollbar-width: none;
      }
      .tp-col::-webkit-scrollbar { display: none; }
      .tp-item {
        height: 40px; display: flex; align-items: center; justify-content: center;
        font-size: 22px; color: #1c1c1e; scroll-snap-align: center;
        font-variant-numeric: tabular-nums;
      }
      .tp-sep { font-size: 24px; font-weight: 600; padding: 0 6px; color: #1c1c1e; z-index: 3; }
    </style>
</head>
<body>
    <div id="installOverlay">
        <h2>📱 نصب برنامه</h2>
        <p>برای استفاده راحت‌تر، برنامه را روی صفحه اصلی گوشی نصب کنید.</p>
        <button type="button" class="install-btn" id="installAppBtn">نصب برنامه</button>
        <button type="button" class="skip-btn" id="skipInstallBtn">الان نه — ادامه در مرورگر</button>
        <p class="hint" id="installHint">اگر دکمه کار نکرد: منوی کروم ⋮ ← Install app یا Add to Home screen</p>
    </div>

    <div id="timePickerModal" aria-hidden="true">
      <div class="tp-sheet">
        <div class="tp-header">
          <button type="button" id="tpCancel">انصراف</button>
          <span class="tp-title" id="tpTitle">انتخاب ساعت</span>
          <button type="button" id="tpConfirm">تأیید</button>
        </div>
        <div class="tp-date" id="tpDateLabel">تاریخ: امروز</div>
        <div class="tp-wheels">
          <div class="tp-highlight"></div>
          <div class="tp-col" id="tpHour"></div>
          <div class="tp-sep">:</div>
          <div class="tp-col" id="tpMinute"></div>
        </div>
      </div>
    </div>

    <div class="container" id="appRoot">
        <div class="header">
            <h1>📱 سیستم ثبت ورود و خروج</h1>
            <p>محاسبه اضافه کار هوشمند</p>
        </div>
        <div id="statusMessage"></div>
        <div id="registerScreen" class="screen active">
            <div class="employee-section">
                <label for="firstName">نام:</label>
                <input type="text" id="firstName" placeholder="نام خود را وارد کنید">
                <label for="lastName">نام خانوادگی:</label>
                <input type="text" id="lastName" placeholder="نام خانوادگی خود را وارد کنید">
                <label for="registerPersonnelId">شماره پرسنلی:</label>
                <input type="tel" id="registerPersonnelId" placeholder="شماره پرسنلی را وارد کنید" inputmode="numeric" pattern="[0-9]*" maxlength="10">
            </div>
            <div class="button-group">
                <button class="btn-success" id="registerBtn">✓ ثبت نام</button>
            </div>
        </div>
        <div id="mainScreen" class="screen">
            <div class="tabs">
                <button class="tab-btn active" data-tab="checkin">ثبت ورود/خروج</button>
                <button class="tab-btn" data-tab="records">سوابق</button>
                <button class="tab-btn" data-tab="overtime">اضافه کار</button>
            </div>
            <div id="checkin" class="tab-content active">
                <div class="info-section" id="userInfoBox">
                    <p style="font-weight:600;color:#333;font-size:16px" id="userFullName">—</p>
                    <p style="font-size:13px;color:#666" id="userPersonnelId">شماره پرسنلی: —</p>
                </div>
                <div class="info-section">
                    <p class="time-display" id="currentTime"></p>
                    <p id="dateDisplay"></p>
                </div>
                <div class="button-group">
                    <button class="btn-success" id="checkInBtn">✓ ورود</button>
                    <button class="btn-danger" id="checkOutBtn">✕ خروج</button>
                </div>
            </div>
            <div id="records" class="tab-content">
                <div class="records-section">
                    <h3>📋 سوابق ورود و خروج</h3>
                    <div class="button-group" style="margin-bottom:15px">
                        <button class="btn-danger" id="clearRecords">🗑️ پاک کردن همه</button>
                    </div>
                    <div id="recordsList"></div>
                </div>
            </div>
            <div id="overtime" class="tab-content">
                <div style="display:flex;gap:10px;margin-bottom:20px">
                    <button class="btn-info" id="calculateBtn" style="flex:1">🧮 محاسبه اضافه کار</button>
                </div>
                <div id="overtimeList" class="overtime-section" style="display:none">
                    <h3 style="color:#c53030;margin-bottom:15px">⏱️ اضافه کار کارکنان</h3>
                    <div id="overtimeContent"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="install.js"></script>
    <script src="app.js"></script>
</body>
</html>
