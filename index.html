<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>گزارش کار روزانه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg: #16181b;
    --panel: #1f2226;
    --panel-2: #262a2f;
    --line: #34383e;
    --amber: #e8871e;
    --amber-dim: #4a3620;
    --green: #4caf7d;
    --red: #d9564b;
    --text: #edeff1;
    --muted: #93989f;
    --mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
    padding-bottom: 100px;
  }
  .hazard-bar{
    height: 6px;
    background: repeating-linear-gradient(135deg, var(--amber), var(--amber) 10px, #1a1a1a 10px, #1a1a1a 20px);
  }
  header{
    padding: 20px 18px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .eyebrow{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  h1{
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 2px;
  }
  .sub{
    color: var(--muted);
    font-size: 13px;
  }
  .ticket{
    margin: 16px 14px 0;
    background: var(--panel);
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .ticket::before, .ticket::after{
    content:'';
    position: absolute;
    top: 50%;
    width: 16px; height: 16px;
    background: var(--bg);
    border-radius: 50%;
    transform: translateY(-50%);
  }
  .ticket::before{ right: -9px; }
  .ticket::after{ left: -9px; }
  .ticket-count{
    font-family: var(--mono);
    font-size: 28px;
    font-weight: 600;
    color: var(--amber);
    line-height: 1;
  }
  .ticket-label{
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  main{
    padding: 18px 14px 0;
  }
  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 14px;
  }
  .card-title{
    font-size: 12px;
    color: var(--amber);
    font-family: var(--mono);
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .card-title::before{
    content:'';
    width:8px; height:8px;
    background: var(--amber);
    border-radius: 2px;
    display:inline-block;
  }
  .field{ margin-bottom: 14px; }
  .field:last-child{ margin-bottom: 0; }
  label{
    display:block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input, select, textarea{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 12px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color .15s ease;
  }
  input:focus, select:focus, textarea:focus{
    border-color: var(--amber);
  }
  input[type=number], input[type=time], input.numfield{
    font-family: var(--mono);
    direction: ltr;
    text-align: right;
  }
  .row2{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .row3{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  textarea{ resize: vertical; min-height: 60px; }
  select{ appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: 16px center, 11px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; padding-left: 30px;}

  .save-btn{
    width: 100%;
    background: var(--amber);
    color: #1a1207;
    border: none;
    border-radius: 12px;
    padding: 15px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
  }
  .save-btn:active{ transform: scale(0.98); }

  .log{
    padding: 4px 14px 0;
  }
  .log-title{
    font-size: 13px;
    color: var(--muted);
    margin: 18px 4px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .log-title button{
    background:none;
    border:none;
    color: var(--red);
    font-family: 'Vazirmatn', sans-serif;
    font-size: 12px;
    cursor:pointer;
    padding: 4px 8px;
  }
  .entry{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 13px;
    display:flex;
    justify-content: space-between;
    gap: 10px;
  }
  .entry-main{ flex:1; }
  .entry-part{ font-weight:600; margin-bottom:2px; }
  .entry-meta{ color: var(--muted); font-size:12px; }
  .entry-nums{
    font-family: var(--mono);
    font-size: 12px;
    text-align: left;
    direction: ltr;
    color: var(--muted);
    white-space: nowrap;
  }
  .entry-nums b{ color: var(--green); }
  .entry-del{
    background:none; border:none; color: var(--muted); font-size:16px; cursor:pointer; padding: 0 2px;
  }
  .empty{
    text-align:center;
    color: var(--muted);
    font-size: 13px;
    padding: 24px 0;
  }

  .fab-bar{
    position: fixed;
    bottom: 0; left: 0; right: 0;
    padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .share-btn{
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--amber);
    color: var(--amber);
    border-radius: 12px;
    padding: 14px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 8px;
  }
  .share-btn:disabled{ opacity: 0.4; }
  .toast{
    position: fixed;
    bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    opacity: 0;
    transition: all .25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="hazard-bar"></div>
<header>
  <div class="eyebrow">PF-009-002 &middot; شرکت خدمات پزشکی دوستان نیک</div>
  <h1>گزارش کار روزانه واحدهای تولیدی</h1>
  <div class="sub">داده‌ها فقط روی همین گوشی ذخیره می‌شن</div>
</header>

<div class="ticket">
  <div>
    <div class="ticket-count" id="entryCount">0</div>
    <div class="ticket-label">ردیف ثبت‌شده</div>
  </div>
  <div style="text-align:left">
    <div class="ticket-count" id="todayCount" style="color:var(--green)">0</div>
    <div class="ticket-label">امروز</div>
  </div>
</div>

<main>
  <div class="card">
    <div class="card-title">اطلاعات شیفت</div>
    <div class="row2">
      <div class="field">
        <label>تاریخ <span style="color:var(--red)">*</span></label>
        <input type="text" id="f_date" readonly style="direction:ltr; text-align:right; font-family:var(--mono);">
      </div>
      <div class="field">
        <label>عنوان شیفت کاری</label>
        <select id="f_shift">
          <option value="">— انتخاب کنید —</option>
          <option value="شیفت روز">شیفت روز</option>
          <option value="شیفت شب">شیفت شب</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>نام واحد تولیدی <span style="color:var(--red)">*</span></label>
        <select id="f_unit">
          <option value="">— انتخاب کنید —</option>
          <option value="لیزر مارک">لیزر مارک</option>
          <option value="فاینال کنترل">فاینال کنترل</option>
          <option value="کلین روم">کلین روم</option>
          <option value="گری روم">گری روم</option>
          <option value="بسته بندی">بسته بندی</option>
        </select>
      </div>
      <div class="field">
        <label>نام دستگاه <span style="color:var(--red)">*</span></label>
        <select id="f_machine">
          <option value="">— انتخاب کنید —</option>
          <option value="پانتوگراف">پانتوگراف</option>
          <option value="لیزر">لیزر</option>
          <option value="گاندوس">گاندوس</option>
          <option value="شیرینگ (تهران پک)">شیرینگ (تهران پک)</option>
          <option value="شیرینگ (نادین پک)">شیرینگ (نادین پک)</option>
          <option value="لیبل پرینت ( Zebra ) جدید">لیبل پرینت ( Zebra ) جدید</option>
          <option value="لیبل پرینت (TTX ) قدیم">لیبل پرینت (TTX ) قدیم</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>نام اپراتور <span style="color:var(--red)">*</span></label>
      <select id="f_operator">
        <option value="">— انتخاب کنید —</option>
        <option value="پریسا کوپائی">پریسا کوپائی</option>
        <option value="فاطمه کارگر">فاطمه کارگر</option>
        <option value="هانیه مطفری">هانیه مطفری</option>
        <option value="سارا شیخی گروهی">سارا شیخی گروهی</option>
        <option value="سارا عسگرخوانی">سارا عسگرخوانی</option>
        <option value="لیلا قنبری">لیلا قنبری</option>
        <option value="حدیث جان جان">حدیث جان جان</option>
        <option value="ستایش علیزاده">ستایش علیزاده</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="card-title">اطلاعات محموله</div>
    <div class="field">
      <label>نام قطعه <span style="color:var(--red)">*</span></label>
      <select id="f_part">
        <option value="">— انتخاب کنید —</option>
        <option value="Cemented Stem">Cemented Stem</option>
        <option value="Cement less  Stem">Cement less  Stem</option>
        <option value="Ps Femur">Ps Femur</option>
        <option value="Femoral head">Femoral head</option>
        <option value="Ps insert">Ps insert</option>
        <option value="Tibial Base">Tibial Base</option>
        <option value="Hip Screw">Hip Screw</option>
        <option value="Bipolar ( PE CUP )">Bipolar ( PE CUP )</option>
        <option value="Bipolar ( Shell )">Bipolar ( Shell )</option>
        <option value="PE ring">PE ring</option>
        <option value="Metal Back">Metal Back</option>
        <option value="Liner">Liner</option>
        <option value="Extension Stem">Extension Stem</option>
        <option value="Stabilized">Stabilized</option>
      </select>
    </div>
    <div class="field" id="sizeField" style="display:none">
      <label>سایز <span style="color:var(--red)">*</span></label>
      <select id="f_size"></select>
    </div>
    <div class="row2">
      <div class="field">
        <label>مرحله تولید (OP)</label>
        <input type="text" id="f_op" class="numfield" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="field">
        <label>شماره محموله <span style="color:var(--red)">*</span></label>
        <input type="text" id="f_batch" class="numfield" inputmode="numeric" pattern="[0-9]*">
      </div>
    </div>
    <div class="row3">
      <div class="field">
        <label>تعداد کل <span style="color:var(--red)">*</span></label>
        <input type="text" id="f_total" class="numfield" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="field">
        <label>تعداد سالم <span style="color:var(--red)">*</span></label>
        <input type="text" id="f_ok" class="numfield" inputmode="numeric" pattern="[0-9]*">
      </div>
      <div class="field">
        <label>ضایعات</label>
        <input type="text" id="f_bad" class="numfield" inputmode="numeric" pattern="[0-9]*">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">زمان و توقف</div>
    <div class="row2">
      <div class="field">
        <label>ساعت شروع</label>
        <input type="time" id="f_start">
      </div>
      <div class="field">
        <label>ساعت اتمام</label>
        <input type="time" id="f_end">
      </div>
    </div>
    <div class="field">
      <label>علت توقف</label>
      <select id="f_stopcode">
        <option value="">— بدون توقف —</option>
        <option value="1 - ستاپ دستگاه">1 - ستاپ دستگاه</option>
        <option value="2 - نظافت، تخلیه پلیسه و شارژ آب صابون">2 - نظافت، تخلیه پلیسه و شارژ آب صابون</option>
        <option value="3 - تایید QC">3 - تایید QC</option>
        <option value="4 - تعویض ابزار">4 - تعویض ابزار</option>
        <option value="5 - مرخصی">5 - مرخصی</option>
        <option value="6 - خرابی دستگاه">6 - خرابی دستگاه</option>
        <option value="7 - کار بر روی اره نواری/تراش دستی">7 - کار بر روی اره نواری/تراش دستی</option>
        <option value="8 - نوسانات و قطع برق">8 - نوسانات و قطع برق</option>
        <option value="9 - منتظر رسیدن قطعه از مرحله قبل">9 - منتظر رسیدن قطعه از مرحله قبل</option>
        <option value="10 - نبود ابزار و مواد اولیه">10 - نبود ابزار و مواد اولیه</option>
        <option value="11 - نبود نقشه تولید">11 - نبود نقشه تولید</option>
        <option value="12 - خرابی مواد اولیه">12 - خرابی مواد اولیه</option>
        <option value="13 - تاخیر در تغذیه خطوط تولید">13 - تاخیر در تغذیه خطوط تولید</option>
        <option value="14 - سایر">14 - سایر</option>
      </select>
    </div>
    <div class="field">
      <label>زمان توقف (دقیقه)</label>
      <input type="text" id="f_stopmin" class="numfield" inputmode="numeric" pattern="[0-9]*">
    </div>
    <div class="field">
      <label>توضیحات</label>
      <textarea id="f_notes"></textarea>
    </div>
  </div>

  <button class="save-btn" id="saveBtn">ثبت ردیف</button>

  <div class="log">
    <div class="log-title">
      <span>ردیف‌های ثبت‌شده</span>
      <button id="clearBtn">پاک کردن همه</button>
    </div>
    <div id="entryList"></div>
  </div>
</main>

<div class="fab-bar">
  <button class="share-btn" id="shareBtn" disabled style="margin-bottom:8px;">
    <span>↗</span> اشتراک‌گذاری خروجی اکسل
  </button>
  <button class="share-btn" id="shareFormBtn" disabled style="margin-bottom:8px;">
    <span>🖨</span> اشتراک‌گذاری فرم (PDF)
  </button>
  <button class="share-btn" id="syncSheetBtn" disabled>
    <span>☁</span> همگام‌سازی با Google Sheets
  </button>
  <a id="sheetLinkAnchor" href="#" target="_blank" style="display:none; text-align:center; margin-top:8px; color:var(--green); font-size:13px; text-decoration:underline;">مشاهده شیت در Google Sheets ↗</a>
</div>

<div class="toast" id="toast"></div>

<script>
const HEADERS = ["تاریخ","نام واحد تولیدی","نام دستگاه","نام اپراتور","عنوان شیفت کاری","نام قطعه و سایز","مرحله تولید (OP)","شماره محموله","تعداد کل محموله","تعداد سالم","تعداد ضایعات","ساعت شروع","ساعت اتمام","علت توقف","زمان توقف (دقیقه)","توضیحات"];
const FIELD_IDS = ["f_date","f_unit","f_machine","f_operator","f_shift","f_part","f_op","f_batch","f_total","f_ok","f_bad","f_start","f_end","f_stopcode","f_stopmin","f_notes"];

let entries = [];
const STORAGE_KEY = "production_entries";

function toJalali(gy, gm, gd) {
  var g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
  var jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  var gy2 = (gm > 2) ? (gy + 1) : gy;
  var days = (365 * gy) + (parseInt((gy2 + 3) / 4)) - (parseInt((gy2 + 99) / 100)) + (parseInt((gy2 + 399) / 400)) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * parseInt(days / 12053);
  days %= 12053;
  jy += 4 * parseInt(days / 1461);
  days %= 1461;
  if (days > 365) {
    jy += parseInt((days - 1) / 365);
    days = (days - 1) % 365;
  }
  var jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
  var jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return [jy, jm, jd];
}

function todayStr(){
  const now = new Date();
  const [jy, jm, jd] = toJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
  const pad = n => String(n).padStart(2, '0');
  return `${jy}/${pad(jm)}/${pad(jd)}`;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadEntries(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    entries = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    entries = [];
  }
  renderEntries();
}

async function persistEntries(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries), false);
  }catch(e){
    toast('ذخیره‌سازی با مشکل مواجه شد');
  }
}

function renderEntries(){
  const list = document.getElementById('entryList');
  document.getElementById('entryCount').textContent = entries.length;
  const today = todayStr();
  document.getElementById('todayCount').textContent = entries.filter(e=>e[0]===today).length;
  document.getElementById('shareBtn').disabled = entries.length === 0;
  document.getElementById('shareFormBtn').disabled = entries.length === 0;
  document.getElementById('syncSheetBtn').disabled = entries.length === 0;

  if(entries.length === 0){
    list.innerHTML = '<div class="empty">هنوز چیزی ثبت نشده</div>';
    return;
  }
  list.innerHTML = entries.slice().reverse().map((e, revIdx)=>{
    const idx = entries.length - 1 - revIdx;
    const part = e[5] || '—';
    const meta = [e[0], e[1], e[3]].filter(Boolean).join(' · ');
    const ok = e[9] || 0;
    const bad = e[10] || 0;
    return `<div class="entry">
      <div class="entry-main">
        <div class="entry-part">${escapeHtml(part)}</div>
        <div class="entry-meta">${escapeHtml(meta)}</div>
      </div>
      <div class="entry-nums">
        <b>${ok}</b> سالم / ${bad} ضایع
      </div>
      <button class="entry-del" data-idx="${idx}">✕</button>
    </div>`;
  }).join('');

  list.querySelectorAll('.entry-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const idx = parseInt(btn.dataset.idx, 10);
      entries.splice(idx, 1);
      await persistEntries();
      renderEntries();
    });
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('f_date').value = todayStr();

const STEM_SIZES = ["8","9","10","11","12","13","14","15","16"];
const PS_FEMUR_SIZES = ["1-L","1-R","2-L","2-R","3-L","3-R","4-L","4-R","5-L","5-R","6-L","6-R"];

const FEMORAL_HEAD_SIZES = [];
[28,32,36].forEach(d=>{
  ["S","M","L","XL","XXL"].forEach(l=>{

function updateSizeVisibility(){
  const partVal = document.getElementById('f_part').value;
  const sizeField = document.getElementById('sizeField');
  const sizeSelect = document.getElementById('f_size');
  const options = SIZE_MAP[partVal];
  if(options){
    sizeSelect.innerHTML = '<option value="">— انتخاب کنید —</option>' +
      options.map(s => `<option value="${s}">${s}</option>`).join('');
    sizeField.style.display = '';
  }else{
    sizeSelect.innerHTML = '';
    sizeField.style.display = 'none';
  }
}

// آدرس Web App اسکریپت گوگل که داده‌ها رو به گوگل‌شیت مشترک اضافه می‌کنه
// این مقدار رو بعد از Deploy کردن Apps Script با آدرس واقعی خودتون جایگزین کنید
const GOOGLE_SCRIPT_URL = "";

function sendRowToGoogleSheet(row){
  if(!GOOGLE_SCRIPT_URL) return;
  try{
    fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ row: row })
    }).catch(()=>{});
  }catch(err){}
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const row = FIELD_IDS.map(id => document.getElementById(id).value || '');
  const partIdx = FIELD_IDS.indexOf('f_part');
  const sizeVal = document.getElementById('f_size').value;
  const sizeRequired = document.getElementById('sizeField').style.display !== 'none';

  const requiredMissing = [];
  const reqCheck = [
    ['f_date','تاریخ'],
    ['f_unit','نام واحد تولیدی'],
    ['f_machine','نام دستگاه'],
    ['f_operator','نام اپراتور'],
    ['f_part','نام قطعه'],
    ['f_batch','شماره محموله'],
    ['f_total','تعداد کل'],
    ['f_ok','تعداد سالم']
  ];
  reqCheck.forEach(([id,label])=>{
    if(!document.getElementById(id).value) requiredMissing.push(label);
  });
  if(sizeRequired && !sizeVal) requiredMissing.push('سایز');

  if(requiredMissing.length){
    toast('پر کردن این موارد اجباریه: ' + requiredMissing.join('، '));
    return;
  }

  if(sizeVal){
    row[partIdx] = row[partIdx] + ' - ' + sizeVal;
  }
  entries.push(row);
  await persistEntries();
  sendRowToGoogleSheet(row);
  renderEntries();
  toast('ردیف ثبت شد ✓');

  FIELD_IDS.forEach(id=>{
    if(id === 'f_date') return;
    if(id === 'f_unit' || id === 'f_machine' || id === 'f_operator' || id === 'f_shift') return;
    document.getElementById(id).value = '';
  });
  document.getElementById('f_size').value = '';
  updateSizeVisibility();
});

document.getElementById('clearBtn').addEventListener('click', async ()=>{

function buildNoteCell(row){
  return row[15] || '';
}

function computeStopMinutesByCode(rows){
  const totals = {};
  rows.forEach(row=>{
    if(!row) return;
    const stopcode = row[13];
    const stopmin = parseFloat(row[14]);
    if(!stopcode || !stopmin) return;
    const code = stopcode.split('-')[0].trim();
    totals[code] = (totals[code] || 0) + stopmin;
  });
  return totals;
}

function buildStopCodeTable(group, totals){
  const rowsHtml = group.map(([code, label])=>{
    const total = totals[code];
    const hit = total ? `<span style="font-weight:800;">✓ ${total}</span>` : '';
    return `<tr>
      <td style="border:1px solid #999;padding:4px 6px;text-align:center;font-weight:700;width:26px;">${code}</td>
      <td style="border:1px solid #999;padding:4px 6px;">${escapeHtml(label)}</td>
      <td style="border:1px solid #999;padding:4px 6px;text-align:center;width:60px;">${hit}</td>
    </tr>`;
  }).join('');
  return `<table style="border-collapse:collapse;font-size:10px;width:100%;">
    <thead>
      <tr style="background:#ddd;">
        <th style="border:1px solid #999;padding:4px 6px;">کد توقف</th>

}

async function generateFormPDF(){
  if(entries.length === 0) return;
  toast('در حال آماده‌سازی PDF...');

  const groups = {};
  const order = [];
  entries.forEach(row=>{
    const key = row.slice(0,5).join('|');
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(row);
  });

  const pdf = new jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
  let first = true;

  for(const key of order){
    const rows = groups[key];
    const headerVals = rows[0].slice(0, 5);
    for(let i = 0; i < rows.length; i += 6){
      const chunk = rows.slice(i, i + 6);
      const page = buildPrintPage(headerVals, chunk);
      document.body.appendChild(page);
      const canvas = await html2canvas(page, { scale: 2, backgroundColor: '#ffffff' });
      document.body.removeChild(page);
      const imgData = canvas.toDataURL('image/png');
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const imgProps = pdf.getImageProperties(imgData);
      const ratio = Math.min(pageWidth / imgProps.width, pageHeight / imgProps.height);
      const w = imgProps.width * ratio;
      const h = imgProps.height * ratio;
      if(!first) pdf.addPage();
      pdf.addImage(imgData, 'PNG', (pageWidth - w) / 2, (pageHeight - h) / 2, w, h);
      first = false;
    }
  }

  const blob = pdf.output('blob');
  const fileName = `فرم-گزارش-${todayStr().replace(/\//g, '-')}.pdf`;
  const file = new File([blob], fileName, { type: 'application/pdf' });

  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({ files: [file], title: 'گزارش کار روزانه', text: 'فرم گزارش کار روزانه' });
      toast('ارسال شد');
    }catch(err){
      if(err.name !== 'AbortError') toast('اشتراک‌گذاری لغو شد');
    }
  }else{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('فایل PDF دانلود شد');
  }
}

document.getElementById('shareFormBtn').addEventListener('click', generateFormPDF);

async function syncToGoogleSheets(){
  if(entries.length === 0) return;
  const btn = document.getElementById('syncSheetBtn');
  btn.disabled = true;
  toast('در حال اتصال به Google Sheets...');

  try{
    const tsvHeader = HEADERS.join('\t');
    const tsvRows = entries.map(r => r.map(v => (v || '').toString().replace(/\t/g,' ')).join('\t')).join('\n');
    const sheetTitle = `گزارش تولید ${todayStr()}`;
    const prompt = `یک Google Sheet جدید در Google Drive با عنوان "${sheetTitle}" بساز و داده‌های زیر (جدا شده با تب) را در آن وارد کن، ردیف اول باید همین سرستون‌ها باشد و هر خط بعدی یک ردیف داده است:\n\n${tsvHeader}\n${tsvRows}\n\nدر پایان فقط لینک قابل مشاهده/اشتراک‌گذاری فایل ساخته‌شده را برگردان، بدون هیچ توضیح اضافه‌ای.`;

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        mcp_servers: [{ type: "url", url: "https://drivemcp.googleapis.com/mcp/v1", name: "google-drive" }]
      })
    });

    const data = await response.json();
    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
    const urlMatch = textBlocks.match(/https?:\/\/[^\s)]+/);

    if(urlMatch){
      const link = document.getElementById('sheetLinkAnchor');
      link.href = urlMatch[0];
      link.style.display = 'block';
      toast('همگام‌سازی با Google Sheets انجام شد ✓');
    }else{
      toast('همگام‌سازی انجام شد اما لینک شیت پیدا نشد');
    }
  }catch(err){
    console.error(err);
    toast('خطا در اتصال به Google Sheets');
  }finally{
    btn.disabled = entries.length === 0;
  }
}

document.getElementById('syncSheetBtn').addEventListener('click', syncToGoogleSheets);
