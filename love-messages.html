      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;

      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    /* Floating hearts background */
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      font-size: 20px;
      color: rgba(255, 105, 180, 0.4);
      animation: float 8s infinite ease-in-out;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 650px;
      width: 100%;
      text-align: center;
    }

    .header {
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 2.2rem;
      color: #c2185b;
      text-shadow: 0 2px 10px rgba(194, 24, 91, 0.3);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .header p {
      color: #ad1457;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 40px 30px;
      box-shadow: 
        0 20px 60px rgba(233, 30, 99, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.15) 0%, transparent 60%);
      animation: pulse 6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .message-box {
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0 30px;
      position: relative;
      z-index: 2;
    }

    #message {
      font-size: 1.35rem;
      line-height: 1.9;
      color: #880e4f;
      font-weight: 500;
      transition: opacity 0.4s ease, transform 0.4s ease;
      padding: 10px;
    }

    #message.fade-out {
      opacity: 0;
      transform: translateY(-10px);
    }

    #message.fade-in {
      opacity: 1;
      transform: translateY(0);
    }

    .names {
      font-size: 0.95rem;
      color: #c2185b;
      margin-bottom: 25px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .btn {
      background: linear-gradient(135deg, #ec407a, #e91e63, #d81b60);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 1.15rem;
      font-family: inherit;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 35px rgba(233, 30, 99, 0.55);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
    }

    .btn::before {
      content: '💖';
      font-size: 1.2rem;
    }

    .footer {
      margin-top: 35px;
      color: #ad1457;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .counter {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #c2185b;
      opacity: 0.7;
    }

    /* Decorative elements */
    .deco-heart {
      position: absolute;
      font-size: 1.8rem;
      opacity: 0.15;
      z-index: 0;
    }

    .deco-heart.top-left { top: 15px; left: 20px; }
    .deco-heart.top-right { top: 15px; right: 20px; }
    .deco-heart.bottom-left { bottom: 15px; left: 20px; }
    .deco-heart.bottom-right { bottom: 15px; right: 20px; }

    @media (max-width: 500px) {
      .header h1 { font-size: 1.7rem; }
      #message { font-size: 1.15rem; }
      .card { padding: 30px 20px; }
      .btn { padding: 14px 30px; font-size: 1rem; }
    }
  </style>
