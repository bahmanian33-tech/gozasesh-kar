      100% { transform: translateY(-120px) translateX(calc(var(--sway) * -1)) rotate(360deg) scale(0.8); opacity: 0; }

      position: fixed; font-size: 24px; pointer-events: none; z-index: 100;

      0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }

    @keyframes cardEnter { from { opacity: 0; transform: scale(0.9) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }

      background: radial-gradient(circle, rgba(255, 182, 193, 0.2) 0%, transparent 55%);
      animation: pulse 5s infinite ease-in-out;

      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

      animation: borderGlow 4s ease-in-out infinite alternate; pointer-events: none;
    }

    @keyframes borderGlow { from { opacity: 0.4; } to { opacity: 1; } }
    .message-box { min-height: 160px; display: flex; align-items: center; justify-content: center; margin: 20px 0 30px; position: relative; z-index: 2; }
    #message {

      "عاشق صدای خنده‌هات هستم، قشنگ‌ترین، زیباترین و دل‌نشین‌ترین موسیقی دنیاست.",
      "با تو بودن یعنی احساس زنده بودن واقعی، عمیق، پر از عشق و معنا.",
      "تو دلیل شادی‌های بی‌دلیل، واقعی، عمیق و از ته دل منی.",
      "می‌خوام همیشه مراقب قلبت باشم و ازش با تمام وجود، عشق و قدرت محافظت کنم.",
      "دوست دارم برات گل بخرم و با تمام وجود، از ته دل بگم که چقدر دوستت دارم.",
      "قلبم بدون تو ناقصه و تو با حضورت، عشقت و مهربونیت کاملش می‌کنی.",
      "عاشقتم پریسا، و این عشق تا آخر عمر، فراتر از زمان و ابدیت ادامه داره."
    ];
    const variations = ["", " 💕", " ❤️", " 💗", " همیشه.", " برای همیشه.", " تا ابد.", " از ته دل.", " با تمام وجود.", " از عمق قلبم."];
    const prefixes = ["", "عزیزم، ", "نازنینم، ", "عشقم، ", "جانم، ", "دلم، "];
    let messages = [];
    baseMessages.forEach(msg => {
      variations.forEach(v => {
        prefixes.forEach(p => {
          if (messages.length < 1000) messages.push(p + msg + v);
        });
      });
    });
    while (messages.length < 1000) {
      const m = baseMessages[Math.floor(Math.random() * baseMessages.length)];
      const v = variations[Math.floor(Math.random() * variations.length)];
      const p = prefixes[Math.floor(Math.random() * prefixes.length)];
      messages.push(p + m + v);
    }
    messages = messages.slice(0, 1000);
    let shownCount = 0;
    function createHearts() {
      const container = document.getElementById('hearts');
      const emojis = ['💗', '💕', '💖', '❤️', '💘', '💓', '💞'];
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (14 + Math.random() * 22) + 'px';
        heart.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
        heart.style.animationDuration = (7 + Math.random() * 10) + 's';
        heart.style.animationDelay = Math.random() * 8 + 's';
        container.appendChild(heart);
      }
    }
    function createBurst(x, y) {
      const emojis = ['💗', '💕', '💖', '❤️', '✨', '💘'];
      for (let i = 0; i < 14; i++) {
        const h = document.createElement('div');
        h.className = 'burst-heart';
        h.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = x + 'px';
        h.style.top = y + 'px';
        const angle = (Math.PI * 2 * i) / 14;
        const dist = 60 + Math.random() * 90;
        h.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        h.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        h.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        h.style.fontSize = (16 + Math.random() * 14) + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1100);
      }
    }
    function createSparkles(x, y) {
      for (let i = 0; i < 10; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        s.style.setProperty('--sx', (Math.random() * 120 - 60) + 'px');
        s.style.setProperty('--sy', (Math.random() * 120 - 60) + 'px');
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1200);
      }
    }
    function showRandomMessage() {
      const msgEl = document.getElementById('message');
      const btn = document.getElementById('nextBtn');
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      createBurst(cx, cy);
      createSparkles(cx, cy);
      msgEl.classList.remove('fade-in');
      msgEl.classList.add('fade-out');
      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * messages.length);
        msgEl.textContent = messages[randomIndex];
        msgEl.classList.remove('fade-out');
        msgEl.classList.add('fade-in');
        shownCount++;
        document.getElementById('counter').textContent = `پیام‌های نمایش‌داده‌شده: ${shownCount}`;
      }, 380);
    }
    createHearts();
    showRandomMessage();
  </script>
</body>
</html>
